name: Site PR CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "vitest.config.*"
      - "src/app/page.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "src/app/kontakt/**"
      - "src/app/logowanie/**"
      - "src/app/produkty/**"
      - "src/app/rejestracja/**"
      - "src/app/sklep/**"
      - "src/app/uslugi/**"
      - "src/components/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "vitest.config.*"
      - "src/app/page.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "src/app/kontakt/**"
      - "src/app/logowanie/**"
      - "src/app/produkty/**"
      - "src/app/rejestracja/**"
      - "src/app/sklep/**"
      - "src/app/uslugi/**"
      - "src/components/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      AUTH_SECRET: "ci-public-site-validation-only"
      NEXTAUTH_SECRET: "ci-public-site-validation-only"
      NEXTAUTH_URL: "http://localhost:3000"
      CELTRONICS_DB_PATH: "./src/data/db.json"
      CELTRONICS_UPLOAD_ROOT: "./.ci/celtronics-knowledge"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint public site changes
        run: >
          npx eslint
          src/app/page.tsx
          src/app/layout.tsx
          src/app/kontakt/page.tsx
          src/app/logowanie/page.tsx
          src/app/produkty/page.tsx
          src/app/rejestracja/page.tsx
          src/app/rejestracja/_components/PartnerRegistrationForm.tsx
          src/app/sklep/page.tsx
          src/app/sklep/ShopDashboardClient.tsx
          src/app/sklep/_components/ShopSidebar.tsx
          src/app/sklep/_components/ProductGrid.tsx
          src/app/sklep/_components/ProductCard.tsx
          src/app/sklep/_components/MiniCart.tsx
          src/app/uslugi/page.tsx
          src/components/ui/IconicNav.tsx

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
