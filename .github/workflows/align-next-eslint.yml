name: Align Next ESLint

on:
  push:
    branches:
      - chore/align-next-eslint

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Align eslint-config-next
        run: npm install --save-dev --save-exact eslint-config-next@16.3.6
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(toolchain): align eslint config with Next 16.3.6"
          git push
