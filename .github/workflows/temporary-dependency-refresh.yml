name: Temporary dependency refresh

on:
  push:
    branches:
      - fix/full-platform-audit

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'ci: seed dependency refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      AUTH_SECRET: "ci-dependency-refresh-only"
      NEXTAUTH_SECRET: "ci-dependency-refresh-only"
      NEXTAUTH_URL: "http://localhost:3000"
      ADMIN_BOOTSTRAP_PASSWORD: "ci-bootstrap-only"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/full-platform-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Refresh security-sensitive direct dependencies
        run: >
          npm install --save-exact
          next@16.3.6
          next-auth@5.0.0-beta.32
          nodemailer@10.0.10

      - name: Apply compatible transitive audit fixes
        run: npm audit fix || true

      - name: Run tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Show remaining audit
        run: npm audit --audit-level=high || true

      - name: Commit refreshed dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): refresh vulnerable packages [deps-refresh]"
          git push origin HEAD:fix/full-platform-audit
