name: Full Repo Lint Spike

on:
  push:
    branches:
      - chore/full-repo-lint

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      AUTH_SECRET: "ci-full-lint-only"
      NEXTAUTH_SECRET: "ci-full-lint-only"
      NEXTAUTH_URL: "http://localhost:3000"
      ADMIN_BOOTSTRAP_PASSWORD: "ci-bootstrap-only"
      CELTRONICS_DB_PATH: "./src/data/db.json"
      CELTRONICS_UPLOAD_ROOT: "./.ci/celtronics-knowledge"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
