name: Apply approved catalog heading removal once
on:
  push:
    branches: [fix/remove-29-catalog-headings]
    paths: [.github/workflows/catalog-heading-once.yml]
permissions:
  contents: write
concurrency:
  group: catalog-heading-removal-once
  cancel-in-progress: false
jobs:
  remove-approved-seed-records:
    if: github.repository == 'karnalooch/onics-ecommerce' && github.ref == 'refs/heads/fix/remove-29-catalog-headings'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate and apply to repository seed only
        run: |
          set -euo pipefail
          node --test scripts/ci/test_catalog_heading_removal.mjs
          node scripts/ci/catalog_heading_removal.mjs --apply
          node scripts/ci/catalog_heading_removal.mjs --check
          node scripts/ci/catalog_heading_removal.mjs --apply
          test "$(git diff --name-only)" = 'src/data/db.json'
      - name: Commit exact approved seed change to this branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/remove-29-catalog-headings | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/db.json
          git commit -m 'fix(catalog): remove exactly 29 owner-approved source headings'
          git push origin HEAD:refs/heads/fix/remove-29-catalog-headings
          git rev-parse HEAD > artifacts/catalog-removal/committed-sha.txt
          git archive HEAD src scripts docs .github package.json package-lock.json vitest.config.ts tsconfig.json > artifacts/catalog-removal/source.tar
          cp .local/celtronics/catalog-removal/*.json artifacts/catalog-removal/source-backup.json
      - name: Preserve removal proof and verified backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-heading-removal-${{ github.sha }}
          path: artifacts/catalog-removal/
          if-no-files-found: error
          retention-days: 14
