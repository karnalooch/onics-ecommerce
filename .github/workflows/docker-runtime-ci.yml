name: Docker Runtime CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".node-version"
      - ".nvmrc"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.production.example"
      - "Caddyfile.production"
      - "compose.yaml"
      - "docker-compose*.yml"
      - "START-ONICS.bat"
      - "start-onics.ps1"
      - "scripts/docker/**"
      - "src/auth.ts"
      - "src/lib/adminBootstrap.ts"
      - "src/lib/health.ts"
      - "src/lib/storageConfig.ts"
      - "src/app/api/auth/**"
      - "src/app/api/health/**"
      - "src/app/admin/page.tsx"
      - "src/app/admin/layout.tsx"
      - "src/app/admin/_components/AdminNavigation.tsx"
      - "src/app/logowanie/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - ".node-version"
      - ".nvmrc"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.production.example"
      - "Caddyfile.production"
      - "compose.yaml"
      - "docker-compose*.yml"
      - "START-ONICS.bat"
      - "start-onics.ps1"
      - "scripts/docker/**"
      - "src/auth.ts"
      - "src/lib/adminBootstrap.ts"
      - "src/lib/health.ts"
      - "src/lib/storageConfig.ts"
      - "src/app/api/auth/**"
      - "src/app/api/health/**"
      - "src/app/admin/page.tsx"
      - "src/app/admin/layout.tsx"
      - "src/app/admin/_components/AdminNavigation.tsx"
      - "src/app/logowanie/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Validate production edge configuration
        shell: bash
        run: |
          set -euo pipefail

          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          CELTRONICS_DOMAIN=example.test
          CELTRONICS_DATA_ROOT=/tmp/celtronics-production-ci
          AUTH_SECRET=ci-auth-secret-not-for-production
          NEXTAUTH_SECRET=ci-nextauth-secret-not-for-production
          ADMIN_BOOTSTRAP_PASSWORD=ci-bootstrap-password
          EOF

          docker compose \
            --env-file "$env_file" \
            -f docker-compose.production.yml \
            config --quiet

          docker run --rm \
            -e CELTRONICS_DOMAIN=example.test \
            -v "$PWD/Caddyfile.production:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build and start local runtime
        run: docker compose up -d --build

      - name: Verify production profile fails closed on missing bootstrap secrets
        shell: bash
        run: |
          set -euo pipefail

          image_id="$(docker compose images -q celtronics)"
          if [[ -z "$image_id" ]]; then
            echo "Built CEL-TRONICS image was not found."
            exit 1
          fi

          runtime_dir="$(mktemp -d)"
          chmod 0777 "$runtime_dir"
          trap 'rm -rf "$runtime_dir"' EXIT

          set +e
          missing_session_output="$(
            docker run --rm \
              -e CELTRONICS_RUNTIME_PROFILE=production \
              -v "$runtime_dir:/app/var/celtronics" \
              "$image_id" 2>&1
          )"
          missing_session_status=$?
          set -e

          if [[ "$missing_session_status" -eq 0 ]]; then
            echo "Production runtime unexpectedly started without session secrets."
            exit 1
          fi
          grep -q "AUTH_SECRET and NEXTAUTH_SECRET are required" \
            <<< "$missing_session_output"
          if [[ -e "$runtime_dir/db.json" ]]; then
            echo "Production runtime mutated persistent storage before validating session secrets."
            exit 1
          fi

          rm -rf "$runtime_dir"
          runtime_dir="$(mktemp -d)"
          chmod 0777 "$runtime_dir"

          set +e
          missing_bootstrap_output="$(
            docker run --rm \
              -e CELTRONICS_RUNTIME_PROFILE=production \
              -e AUTH_SECRET=ci-auth-secret \
              -e NEXTAUTH_SECRET=ci-nextauth-secret \
              -v "$runtime_dir:/app/var/celtronics" \
              "$image_id" 2>&1
          )"
          missing_bootstrap_status=$?
          set -e

          if [[ "$missing_bootstrap_status" -eq 0 ]]; then
            echo "Production runtime unexpectedly started with an unsealed admin and no bootstrap secret."
            exit 1
          fi
          grep -q "ADMIN_BOOTSTRAP_PASSWORD is required" \
            <<< "$missing_bootstrap_output"
          if [[ -e "$runtime_dir/db.json" ]]; then
            echo "Production runtime seeded persistent storage before validating first-bootstrap credentials."
            exit 1
          fi

      - name: Wait for healthy container
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker compose ps -q celtronics)"
          if [[ -z "$container_id" ]]; then
            echo "CEL-TRONICS container was not created."
            docker compose ps
            docker compose logs --no-color celtronics || true
            exit 1
          fi

          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs --no-color celtronics
              exit 1
            fi
            sleep 2
          done

          echo "Timed out waiting for Docker healthcheck."
          docker compose logs --no-color celtronics
          exit 1

      - name: Verify HTTP health endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3100/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:3100/api/health/ready
          docker compose exec -T celtronics sh -c 'test "$AUTH_TRUST_HOST" = "true"'

      - name: Verify bootstrap login and admin navigation
        shell: bash
        run: |
          set -euo pipefail

          base_url="http://localhost:3100"
          cookie_jar="$(mktemp)"
          trap 'rm -f "$cookie_jar" csrf.json login.json session.json root.html admin.html root.headers admin.headers' EXIT

          bootstrap_password="$(
            docker compose logs --no-color celtronics |
              sed -n 's/^.*local bootstrap password: //p' |
              tail -n 1
          )"
          if [[ -z "$bootstrap_password" ]]; then
            echo "Bootstrap password was not found in container logs."
            docker compose logs --no-color celtronics
            exit 1
          fi

          curl --fail --silent --show-error             -c "$cookie_jar"             "$base_url/api/auth/csrf" > csrf.json

          csrf_token="$(jq -r '.csrfToken // empty' csrf.json)"
          if [[ -z "$csrf_token" ]]; then
            echo "Auth.js CSRF token was not returned."
            cat csrf.json
            exit 1
          fi

          curl --fail --silent --show-error             -b "$cookie_jar"             -c "$cookie_jar"             -H 'Content-Type: application/x-www-form-urlencoded'             -H 'X-Auth-Return-Redirect: 1'             --data-urlencode "email=admin@celtronics.pl"             --data-urlencode "password=$bootstrap_password"             --data-urlencode "csrfToken=$csrf_token"             --data-urlencode "callbackUrl=http://localhost:3100/admin"             "$base_url/api/auth/callback/credentials" > login.json

          curl --fail --silent --show-error             -b "$cookie_jar"             "$base_url/api/auth/session" > session.json

          jq -e '.user.email == "admin@celtronics.pl" and .user.role == "ADMIN"'             session.json >/dev/null

          curl --fail --silent --show-error             --location             --max-redirs 8             -b "$cookie_jar"             -D root.headers             -o root.html             "$base_url/"

          if ! curl --fail --silent --show-error             --location             --max-redirs 8             -b "$cookie_jar"             -D admin.headers             -o admin.html             "$base_url/admin"; then
            echo "Admin navigation failed. Redirect headers:"
            cat admin.headers || true
            echo "Auth session:"
            cat session.json || true
            exit 1
          fi

          grep -q "Panel operacyjny" admin.html

      - name: Verify non-root runtime and durable volume
        shell: bash
        run: |
          set -euo pipefail

          docker compose exec -T celtronics node -e '
            if (typeof process.getuid === "function" && process.getuid() === 0) {
              throw new Error("Container runtime must not run as root");
            }
          '

          docker compose exec -T celtronics sh -c \
            'printf persisted > /app/var/celtronics/.docker-ci-volume-marker'

          docker compose restart celtronics

          container_id="$(docker compose ps -q celtronics)"
          restarted_healthy="no"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              restarted_healthy="yes"
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs --no-color celtronics
              exit 1
            fi
            sleep 2
          done

          if [[ "$restarted_healthy" != "yes" ]]; then
            echo "Timed out waiting for healthy container after restart."
            docker compose logs --no-color celtronics
            exit 1
          fi

          docker compose exec -T celtronics test \
            -f /app/var/celtronics/.docker-ci-volume-marker

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color celtronics || true

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
