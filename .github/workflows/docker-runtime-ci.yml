name: Docker Runtime CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and start local runtime
        run: docker compose up -d --build

      - name: Wait for healthy container
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker compose ps -q celtronics)"
          if [[ -z "$container_id" ]]; then
            echo "CEL-TRONICS container was not created."
            docker compose ps
            docker compose logs --no-color celtronics || true
            exit 1
          fi

          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs --no-color celtronics
              exit 1
            fi
            sleep 2
          done

          echo "Timed out waiting for Docker healthcheck."
          docker compose logs --no-color celtronics
          exit 1

      - name: Verify HTTP health endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:3001/api/health/ready

      - name: Verify non-root runtime and durable volume
        shell: bash
        run: |
          set -euo pipefail

          docker compose exec -T celtronics node -e '
            if (typeof process.getuid === "function" && process.getuid() === 0) {
              throw new Error("Container runtime must not run as root");
            }
          '

          docker compose exec -T celtronics sh -c \
            'printf persisted > /app/var/celtronics/.docker-ci-volume-marker'

          docker compose restart celtronics

          container_id="$(docker compose ps -q celtronics)"
          restarted_healthy="no"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              restarted_healthy="yes"
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs --no-color celtronics
              exit 1
            fi
            sleep 2
          done

          if [[ "$restarted_healthy" != "yes" ]]; then
            echo "Timed out waiting for healthy container after restart."
            docker compose logs --no-color celtronics
            exit 1
          fi

          docker compose exec -T celtronics test \
            -f /app/var/celtronics/.docker-ci-volume-marker

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color celtronics || true

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
