name: Platform Audit CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-platform-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      AUTH_SECRET: "ci-platform-audit-only"
      NEXTAUTH_SECRET: "ci-platform-audit-only"
      NEXTAUTH_URL: "http://localhost:3000"
      ADMIN_BOOTSTRAP_PASSWORD: "ci-bootstrap-only"
      CELTRONICS_DB_PATH: "./src/data/db.json"
      CELTRONICS_UPLOAD_ROOT: "./.ci/celtronics-knowledge"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint security and commerce core
        run: >
          npx eslint
          next.config.ts
          src/auth.ts
          src/lib/commerce.ts
          src/lib/company.ts
          src/lib/authUtils.ts
          src/lib/adminBootstrap.ts
          src/lib/jsonDb.ts
          src/lib/payments.ts
          src/lib/storageConfig.ts
          src/lib/health.ts
          src/lib/securityHeaders.ts
          src/store/serverStore.ts
          src/lib/knowledge/files.ts
          src/lib/knowledge/KnowledgeContext.tsx
          src/app/api/register/route.ts
          src/app/api/orders/route.ts
          src/app/api/checkout/route.ts
          src/app/api/quotes/route.ts
          src/app/api/webhooks/stripe/route.ts
          src/app/api/admin/import/route.ts
          src/app/api/products/route.ts
          src/app/api/products/ai-description/route.ts
          src/app/api/categories/route.ts
          src/app/api/users/route.ts
          src/app/api/users/discount/route.ts
          src/app/api/repairs/route.ts
          src/app/api/knowledge/route.ts
          src/app/api/knowledge/export/route.ts
          src/app/api/knowledge/upload/route.ts
          src/app/api/knowledge/train/route.ts
          src/app/api/knowledge/train/stream/route.ts
          src/app/api/knowledge/validate-key/route.ts
          src/app/api/health/live/route.ts
          src/app/api/health/ready/route.ts
          src/app/admin/price-lists/_lib/priceLogic.ts

      - name: Reject legacy file-store writers
        run: |
          if grep -R --line-number --fixed-string "saveMockData" src; then
            echo "Legacy saveMockData detected. Use mutateMockData instead."
            exit 1
          fi
          if grep -R --line-number -E "mock(Users|Categories|Manufacturers|Products|Orders|Repairs|KnowledgeMeta)Store" src; then
            echo "Direct legacy global store access detected. Use initializeMockData or mutateMockData."
            exit 1
          fi
          if grep -R --exclude-dir=__tests__ --line-number --fixed-string "mutateMockData(async" src; then
            echo "Async work inside mutateMockData detected. Prepare external work before the DB lock or use synchronous snapshot helpers."
            exit 1
          fi

      - name: Reject public catalog assets
        run: |
          tracked_catalogs="$(git ls-files 'public/uploads/catalogs/**')"
          if [ -n "$tracked_catalogs" ]; then
            echo "Catalog binaries must not be tracked under public/uploads/catalogs."
            printf '%s\n' "$tracked_catalogs"
            exit 1
          fi

      - name: Run tests
        run: npm test -- --run

      - name: File-store recovery drill
        run: |
          set -euo pipefail
          mkdir -p .ci/recovery/backups
          cp src/data/db.json .ci/recovery/live.json
          export CELTRONICS_DB_PATH="$PWD/.ci/recovery/live.json"
          export CELTRONICS_DB_BACKUP_DIR="$PWD/.ci/recovery/backups"

          npm run db:verify
          npm run db:backup
          BACKUP_PATH="$(find "$CELTRONICS_DB_BACKUP_DIR" -maxdepth 1 -type f -name 'db-*.json' | head -n 1)"
          test -n "$BACKUP_PATH"

          printf '{ intentionally-broken-json' > "$CELTRONICS_DB_PATH"
          if npm run db:verify; then
            echo "db:verify unexpectedly accepted malformed JSON."
            exit 1
          fi

          printf '{"owner":"ci-lock"}' > "$CELTRONICS_DB_PATH.lock"
          if npm run db:restore -- --from "$BACKUP_PATH" --confirm; then
            echo "db:restore unexpectedly ignored an active lock."
            exit 1
          fi
          rm "$CELTRONICS_DB_PATH.lock"

          npm run db:restore -- --from "$BACKUP_PATH" --confirm
          npm run db:verify
          cmp src/data/db.json "$CELTRONICS_DB_PATH"

      - name: Production build
        run: npm run build

      - name: Smoke production health endpoints
        run: |
          set -euo pipefail
          mkdir -p "$CELTRONICS_UPLOAD_ROOT" .ci/runtime
          npm start -- -p 3001 > .ci/runtime/server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health/live > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .ci/runtime/server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent --show-error http://127.0.0.1:3001/api/health/live; then
            cat .ci/runtime/server.log
            exit 1
          fi

          if ! curl --fail --silent --show-error http://127.0.0.1:3001/api/health/ready; then
            cat .ci/runtime/server.log
            exit 1
          fi

          curl --fail --silent --show-error -D .ci/runtime/headers.raw -o /dev/null http://127.0.0.1:3001/api/health/live
          tr -d '\r' < .ci/runtime/headers.raw > .ci/runtime/headers.txt

          grep -qi '^x-content-type-options: nosniff' .ci/runtime/headers.txt
          grep -qi '^x-frame-options: DENY' .ci/runtime/headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' .ci/runtime/headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' .ci/runtime/headers.txt

          if grep -qi '^x-powered-by:' .ci/runtime/headers.txt; then
            echo "X-Powered-By must not be exposed."
            cat .ci/runtime/headers.txt
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=high
